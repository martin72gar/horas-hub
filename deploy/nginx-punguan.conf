# /etc/nginx/sites-available/punguan.web.id
# Wildcard: subdomain <slug>.punguan.web.id dilayani app yang sama (rewrite di src/proxy.ts).

server {
    listen 80;
    listen [::]:80;
    server_name punguan.web.id *.punguan.web.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.punguan.web.id;

    ssl_certificate     /etc/letsencrypt/live/punguan.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/punguan.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://punguan.web.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name punguan.web.id *.punguan.web.id;

    ssl_certificate     /etc/letsencrypt/live/punguan.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/punguan.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Import Excel data KK.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;   # APP_PORT di deploy/docker-compose.yml
        proxy_http_version 1.1;
        # Host asli wajib diteruskan: slug tenant dibaca dari header ini.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
